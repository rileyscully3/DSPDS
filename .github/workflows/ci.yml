name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  project-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload M1 diagnostic screenshots
        uses: actions/upload-artifact@v4
        with:
          name: m1-input-diagnostic-screenshots
          path: screenshots/
          retention-days: 14
      - name: Upload synthetic replay fixture
        uses: actions/upload-artifact@v4
        with:
          name: m1-synthetic-replay-fixture
          path: src/test-support/fixtures/m1-synthetic-session.json
          retention-days: 14
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m1-playwright-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  documentation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required contracts
        shell: bash
        run: |
          test -f AGENTS.md
          test -f docs/00-START-HERE.md
          test -f docs/product/PRODUCT_SPEC_SUMMARY.md
          test -f docs/architecture/INPUT_AND_SCIENCE_GUARDRAILS.md
          test -f docs/design/DESIGN_HANDOFF.md
          test -f docs/engineering/IMPLEMENTATION_PLAN.md
